{% load admin_list %}
<p class="paginator hamrah-paginator">
  <span class="hamrah-paginator-count"><strong>{{ cl.result_count }}</strong> رکورد</span>
  <span class="hamrah-pages">{% if pagination_required %}{% for i in page_range %}{% paginator_number cl i %}{% endfor %}{% endif %}</span>
  {% if show_all_url %}<a href="{{ show_all_url }}" class="showall">نمایش همه</a>{% endif %}
  {% if cl.formset and cl.result_count %}<input type="submit" name="_save" class="default" value="ذخیره تغییرات">{% endif %}
</p>
